name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run lint

      # npm audit gates on advisory severity. We accept "moderate"
      # and below quietly; "high" or "critical" fails the build so
      # a freshly published transitive CVE is impossible to ignore.
      # All deps are devDependencies (web/ runs raw via in-browser
      # Babel, no bundle is shipped) — but the lint tools themselves
      # land in CI and are worth auditing for supply-chain risk.
      - run: npm audit --audit-level=high
