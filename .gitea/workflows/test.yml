name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Test with race detector
        run: go test -race ./internal/...

      - name: Build check
        run: go build ./...

      # Short fuzz pass — finds every Fuzz* function in *_test.go
      # and runs each for 20s. No-ops cleanly when there are none.
      # 11 targets × 20s ≈ 4 minutes; bump fuzztime if running on
      # a beefier runner with budget to spare.
      #
      # Two CI-flake mitigations layered together:
      #
      # 1. -fuzzminimizetime=2s caps how long the engine spends
      #    minimizing a freshly-discovered "interesting" input.
      #    Default (60s) was overshooting the 20s budget on slow
      #    shared runners: a finding at second 19 would start
      #    minimizing for up to 60s, the deadline would hit,
      #    and Go would surface "context deadline exceeded".
      #
      # 2. Output-shape check after each invocation. Even with (1),
      #    `go test` can return a context-deadline error when the
      #    coordinator can't shut workers down in time at the
      #    20s edge. A REAL fuzz finding writes
      #    "Failing input written to testdata/fuzz/..." to stdout
      #    and stages the corpus entry for replay. A timing flake
      #    doesn't. We ignore non-zero exits that lack the
      #    failing-input signal and treat the rest as fatal.
      - name: Fuzz (short)
        run: |
          set -e
          files=$(grep -rl 'func Fuzz' --include='*_test.go' internal/)
          for file in $files; do
            dir=$(dirname "$file")
            fns=$(grep -oE 'func (Fuzz[A-Za-z0-9_]+)' "$file" | awk '{print $2}')
            for fn in $fns; do
              echo "::group::Fuzzing $fn in $dir"
              out=$(go test -run='^$' -fuzz="^${fn}$" -fuzztime=20s -fuzzminimizetime=2s "./$dir" 2>&1) && rc=0 || rc=$?
              printf '%s\n' "$out"
              echo "::endgroup::"
              if [ "$rc" -ne 0 ]; then
                if printf '%s' "$out" | grep -q "Failing input written to"; then
                  echo "::error::fuzz target $fn found a failing input"
                  exit 1
                fi
                if printf '%s' "$out" | grep -qE '^[[:space:]]+--- FAIL: '; then
                  echo "::error::fuzz target $fn produced a sub-test failure"
                  exit 1
                fi
                echo "::warning::fuzz target $fn exited non-zero without a failing input (typically 'context deadline exceeded' at the budget edge); treating as a CI-timing flake"
              fi
            done
          done
