# Build the release binaries and cut a GitHub Release on every version tag.
#
# ansbui ships as a single static binary (web/ is embedded) installed next to
# the systemd unit in deploy/ — there is no container — so the release
# artifacts are the binaries themselves plus a SHA256SUMS file.
#
# Trigger: pushing a `vX.Y.Z` tag. A manual `workflow_dispatch` run builds
# every arch and uploads them as workflow artifacts WITHOUT creating a
# Release — a cheap "does it still build and pass" check that also exercises
# this workflow, which a tag push would otherwise be the first thing to run.
# Both paths gate on the same tests as ci.yml.
#
# Least privilege: only the tag-only `publish` job gets contents: write.
# Actions are pinned to full commit SHAs (a mutable tag can be repointed at
# malicious code); the trailing comment records the tag. Keep the comment at
# the FULL version — Dependabot leaves a bare "# v7" stale as the SHA moves.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The same Go gate as ci.yml. A broken tree must never produce a Release.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No cache in the release path: see the build job.
          cache: false
      - name: Go vet
        run: go vet ./...
      - name: Go test (race)
        run: go test -race ./...

      - name: make license-check
        run: make license-check

      # THIRD_PARTY_LICENSES.md is embedded in the binary, so a release must
      # not ship notices that disagree with what is linked into it. This is
      # the ONE place the check gates — see the Makefile for why not on PRs.
      # If it fails: run `make notices` on main, merge that, and re-tag.
      - name: make notices-check
        run: make notices-check

  # Runs on BOTH triggers, so a dispatch proves the build still works.
  # Pure Go (no cgo) cross-compiles with nothing but GOARCH — no QEMU, no
  # buildx.
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cache: false — the release binary is built from a fresh module
      # download, verified against go.sum, and a cold build cache. setup-go
      # otherwise restores GOMODCACHE and GOCACHE from the Actions cache,
      # which jobs on main also write: the CI jobs that run linters, the
      # vulnerability scanner and the test suite. Go does not re-verify
      # what it finds in either cache, so anything that got to run in one
      # of those jobs could leave an object there for the release build to
      # link. A few minutes of rebuild is the price of not having to trust
      # every tool CI runs with the contents of the release.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # A run on a tag ref (pushed, or dispatched on the tag) stamps the tag;
      # one on a branch stamps "dev". The stamp is what /source pins the
      # AGPL source offer to (internal/api/legal.go), and what Settings
      # shows. The ref name reaches the shell through the environment and
      # is refused unless it looks like a version, so a tag name cannot
      # carry anything into the command line.
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          v="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = tag ] || v="dev"
          case "$v" in
            ''|*[!A-Za-z0-9._+-]*) echo "refusing version stamp: $v" >&2; exit 1 ;;
            *) ;;
          esac
          go build -trimpath -ldflags "-s -w -X main.version=${v}" \
            -o "ansbui-linux-${GOARCH}" .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ansbui-linux-${{ matrix.goarch }}
          path: ansbui-linux-${{ matrix.goarch }}
          if-no-files-found: error

  # Tag PUSH only: this is the ONLY job granted contents: write. Requiring
  # event_name == 'push' keeps a manual dispatch — which can target a tag —
  # out of the publishing path entirely.
  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          chmod +x ansbui-linux-*
          sha256sum ansbui-linux-* > SHA256SUMS
          cat SHA256SUMS

      # gh is preinstalled on the runner — no third-party action, so nothing
      # beyond GitHub itself ever sees the token. --generate-notes builds the
      # changelog from the commits since the previous tag. --verify-tag
      # makes gh refuse to create the tag itself: the release is attached
      # to the tag that triggered this run or not made at all.
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/ansbui-linux-* dist/SHA256SUMS
