sonar.projectKey=ansbui
sonar.projectName=ansbui
sonar.projectDescription=Web UI for an Ansible control plane (Go backend + static frontend).

# Sources / tests. Test files were previously counted as source
# because sonar.tests was empty — that distorts code-smell density
# and coverage attribution. Sonar accepts the same comma-separated
# path/glob syntax as sonar.sources for tests; we list both Go
# (_test.go anywhere under internal/) and the small handful of
# test files at the repo root if any get added later.
sonar.sources=main.go,internal,web
sonar.tests=internal
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/vendor/**,**/node_modules/**,**/*.min.*,relay,**/*_test.go
sonar.sourceEncoding=UTF-8

# Go settings
sonar.go.coverage.reportPaths=coverage.out

# JS / CSS — treat React UMD CDN references as external.
sonar.javascript.file.suffixes=.js,.jsx
sonar.css.file.suffixes=.css

# Scoped rule overrides.
#  - Web:InlineScriptCheck: only web/index.html bootstraps via an
#    inline <script type="text/babel"> — that's the whole delivery
#    mechanism for the in-browser JSX runtime. Scoping the
#    exclusion to that one file means a stray inline script
#    elsewhere in web/ would still surface.
#  - javascript:S6847: Sonar's plugin classifies HTML5 <dialog> as
#    a non-interactive element and flags its onClick/onKeyDown
#    handlers. Per the HTML Living Standard dialog IS interactive
#    (showModal/close, top layer, native Escape + focus trap). We
#    narrow the exclusion to the five files that actually host
#    <dialog> elements — one criterion per file because Sonar's
#    resourceKey only supports `*` / `**` / `?`, not brace
#    expansion. Inventory.jsx is on the list only for its host-
#    detail drawer; the table itself uses real <button> elements
#    so a regression on a clickable <div>/<tr>/<th> in any of
#    these files would still need to be inside that one dialog
#    to slip past.
sonar.issue.ignore.multicriteria=noInlineScript,dialogShell,dialogConn,dialogPalette,dialogPlaybooks,dialogInventory
sonar.issue.ignore.multicriteria.noInlineScript.ruleKey=Web:InlineScriptCheck
sonar.issue.ignore.multicriteria.noInlineScript.resourceKey=web/index.html
sonar.issue.ignore.multicriteria.dialogShell.ruleKey=javascript:S6847
sonar.issue.ignore.multicriteria.dialogShell.resourceKey=web/components/Shell.jsx
sonar.issue.ignore.multicriteria.dialogConn.ruleKey=javascript:S6847
sonar.issue.ignore.multicriteria.dialogConn.resourceKey=web/components/ConnectionManager.jsx
sonar.issue.ignore.multicriteria.dialogPalette.ruleKey=javascript:S6847
sonar.issue.ignore.multicriteria.dialogPalette.resourceKey=web/components/CommandPalette.jsx
sonar.issue.ignore.multicriteria.dialogPlaybooks.ruleKey=javascript:S6847
sonar.issue.ignore.multicriteria.dialogPlaybooks.resourceKey=web/views/Playbooks.jsx
sonar.issue.ignore.multicriteria.dialogInventory.ruleKey=javascript:S6847
sonar.issue.ignore.multicriteria.dialogInventory.resourceKey=web/views/Inventory.jsx
