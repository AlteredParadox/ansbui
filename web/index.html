<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1280"/>
  <title>ansbui — Ansible Control Plane</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/tokens.css"/>
  <link rel="stylesheet" href="styles/app.css"/>
  <link rel="stylesheet" href="styles/ansbui.css"/>
</head>
<body data-theme="dark" data-density="balanced">
  <div id="root"></div>

  <!-- Vendored runtime (web/vendor/, embedded in the binary) so the
       control plane keeps working with no CDN reachability. Files are
       the exact bytes previously loaded from unpkg with SRI:
         react@18.3.1/umd/react.production.min.js         sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z
         react-dom@18.3.1/umd/react-dom.production.min.js sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1
         @babel/standalone@7.29.14/babel.min.js           sha384-NFMPdlT9NRMyYGArFJIgafm5emdRea6aGKLXhUrnDhERRKmOn3QJsnCiZpc1+CD9
       Verify after any re-vendor: openssl dgst -sha384 -binary <file> | openssl base64 -A -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>

  <script src="data/api.js"></script>

  <script type="text/babel" src="components/Icon.jsx"></script>
  <script type="text/babel" src="views/Login.jsx"></script>
  <script type="text/babel" src="components/Shell.jsx"></script>
  <script type="text/babel" src="components/CommandPalette.jsx"></script>
  <script type="text/babel" src="components/ConnectionManager.jsx"></script>
  <script type="text/babel" src="views/Dashboard.jsx"></script>
  <script type="text/babel" src="views/Inventory.jsx"></script>
  <script type="text/babel" src="views/Playbooks.jsx"></script>
  <script type="text/babel" src="views/Adhoc.jsx"></script>
  <script type="text/babel" src="views/Bootstrap.jsx"></script>
  <script type="text/babel" src="views/History.jsx"></script>
  <script type="text/babel" src="views/Vault.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    function Boot() {
      const [phase, setPhase] = useState('loading');
      const [servers, setServers] = useState([]);
      const [activeId, setActiveId] = useState('');
      const [showManager, setShowManager] = useState(false);
      const [error, setError] = useState('');
      const [authEnabled, setAuthEnabled] = useState(false);

      const logout = useCallback(async () => {
        // Same guard as App's navigation wrapper: signing out unmounts
        // the whole app, which closes any live run WebSocket, and the
        // backend kills the remote ansible process on peer disconnect.
        const active = globalThis.AnsbuiActiveRun;
        if (active && !globalThis.confirmAbandonRun(active.label, 'signing out')) return;
        try { await window.AnsbuiAPI.logout(); } catch (e) { /* fall through to login regardless */ }
        setPhase('login');
      }, []);

      // Set by the 401 handler below so bootstrap() knows a mid-flight
      // 401 already routed to the login screen and its own phase
      // transitions must stand down — including when refreshData()'s
      // per-fetch catches swallow the throw and bootstrap would
      // otherwise sail on to 'ready'.
      const sawUnauthorized = useRef(false);

      const bootstrap = useCallback(async (options = {}) => {
        setError('');
        sawUnauthorized.current = false;
        try {
          // Gate on auth first: when a password is set and this
          // session isn't valid, show the login screen instead of
          // firing data fetches that would just 401.
          const auth = await window.AnsbuiAPI.authStatus();
          setAuthEnabled(auth.enabled);
          if (auth.enabled && !auth.authenticated) {
            setPhase('login');
            return;
          }
          const res = await window.AnsbuiAPI.listServers();
          setServers(res.servers || []);
          setActiveId(res.activeServerId || '');
          if (!res.activeServerId) {
            setPhase('picker');
            setShowManager(true);
            return;
          }
          await window.AnsbuiAPI.refreshData();
          if (sawUnauthorized.current) return;
          setPhase('ready');
          setShowManager(options.keepManagerOpen || false);
        } catch (e) {
          if (sawUnauthorized.current) return;
          setError(e.message);
          setPhase('picker');
          setShowManager(true);
        }
      }, []);

      // A 401 from any endpoint (session expired mid-use) drops back
      // to the login screen instead of surfacing a raw error.
      useEffect(() => {
        window.AnsbuiAPI.setUnauthorizedHandler(() => {
          sawUnauthorized.current = true;
          setPhase('login');
        });
      }, []);

      useEffect(() => { bootstrap(); }, [bootstrap]);

      if (phase === 'login') {
        return <window.LoginView onSuccess={() => { setPhase('loading'); bootstrap(); }}/>;
      }

      if (phase === 'loading') {
        return (
          <div className="boot-screen">
            <div className="boot-card">
              <div className="boot-brand">
                <BrandMark/>
                <div>
                  <h1 className="boot-title">ansbui</h1>
                  <div className="boot-sub mono">connecting…</div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      if (phase === 'picker') {
        return (
          <>
            <div className="boot-screen">
              <div className="boot-card">
                <div className="boot-brand">
                  <BrandMark/>
                  <div>
                    <h1 className="boot-title">ansbui</h1>
                    <div className="boot-sub mono">select an ansible server to continue</div>
                  </div>
                </div>
                {error && <div className="boot-error">{error}</div>}
                <div className="mute" style={{ fontSize: 12.5, marginBottom: 16 }}>
                  {servers.length === 0
                    ? 'No connections configured yet. Add the SSH coordinates of an ansible control node to begin.'
                    : 'Pick a connection below or open the manager to edit.'}
                </div>
                <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                  {servers.map(s => (
                    <button key={s.id} className="btn" onClick={async () => {
                      await window.AnsbuiAPI.activateServer(s.id);
                      bootstrap();
                    }}>
                      <Icon name="server" size={13}/> {s.name}
                    </button>
                  ))}
                  <button className="btn primary" onClick={() => setShowManager(true)}>
                    <Icon name="plus" size={12}/> {servers.length ? 'Manage connections' : 'Add connection'}
                  </button>
                </div>
              </div>
            </div>
            <window.ConnectionManager
              open={showManager}
              onClose={() => setShowManager(false)}
              onActivated={() => bootstrap()}
              initialServers={servers}
              initialActiveId={activeId}
            />
          </>
        );
      }

      return <App activeId={activeId} servers={servers} onReload={bootstrap} authEnabled={authEnabled} onLogout={logout}/>;
    }

    function BrandMark() {
      return (
        <div className="brand-mark" aria-hidden>
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path d="M4 19 12 4l8 15" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"/>
            <path d="M7.8 15h8.4" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>
          </svg>
        </div>
      );
    }

    function App({ activeId, servers, onReload, authEnabled, onLogout }) {
      const [view, setViewRaw] = useState(() => {
        // Coerce the legacy 'provision' value so an operator who had
        // the Bootstrap view active when this rename shipped lands on
        // it again instead of a blank screen.
        const raw = localStorage.getItem('ansbui.view');
        if (raw === 'provision') return 'bootstrap';
        return raw || 'dashboard';
      });
      // setView confirms before leaving a view whose streamed run is
      // still live: navigating away unmounts the view, which drops its
      // WebSocket, and the backend kills the remote ansible process on
      // peer disconnect. AnsbuiActiveRun is set by useRunGuard while a
      // run streams. Switching to the same view is always allowed.
      // (viewRef, not a functional updater — confirm() must not run
      // inside the updater, which React may invoke more than once.)
      // Returns true if the navigation happened, false if the operator
      // declined the leave-a-streaming-run confirm — callers that also
      // stage prefill/selection state must gate it on this, or a
      // declined nav leaves stale prefill that fires on the next visit.
      const viewRef = useRef(null);
      viewRef.current = view;
      const setView = useCallback((next) => {
        const active = globalThis.AnsbuiActiveRun;
        if (next !== viewRef.current && active &&
            !globalThis.confirmAbandonRun(active.label, 'leaving this page')) {
          return false;
        }
        setViewRaw(next);
        return true;
      }, []);
      const [paletteOpen, setPaletteOpen] = useState(false);
      const [adhocPrefill, setAdhocPrefill] = useState(null);
      const [playbookId, setPlaybookId] = useState(null);
      const [managerOpen, setManagerOpen] = useState(false);
      const [tweaks, setTweaks] = useState(() => {
        try { return { ...window.TWEAK_DEFAULTS, ...JSON.parse(localStorage.getItem('ansbui.tweaks') || '{}') }; }
        catch { return { ...window.TWEAK_DEFAULTS }; }
      });
      const activeName = (servers.find(s => s.id === activeId) || {}).name || activeId;

      useEffect(() => {
        document.body.dataset.theme = tweaks.theme;
        document.body.dataset.density = tweaks.density;
        document.documentElement.style.setProperty('--accent-hue', tweaks.accentHue);
        localStorage.setItem('ansbui.tweaks', JSON.stringify(tweaks));
      }, [tweaks]);

      useEffect(() => { localStorage.setItem('ansbui.view', view); }, [view]);

      useEffect(() => {
        let gBuffer = 0;
        const onKey = (e) => {
          const tag = (e.target.tagName || '').toLowerCase();
          const typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault(); setPaletteOpen(true); return;
          }
          if (e.key === 'Escape') { setPaletteOpen(false); return; }
          if (typing) return;
          const now = Date.now();
          if (e.key === 'g') { gBuffer = now; return; }
          if (gBuffer && now - gBuffer < 900) {
            gBuffer = 0;
            const map = { d: 'dashboard', i: 'inventory', p: 'playbooks', a: 'adhoc', n: 'bootstrap', r: 'history', s: 'vault' };
            if (map[e.key]) { e.preventDefault(); setView(map[e.key]); }
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const [pbRunnerPrefill, setPbRunnerPrefill] = useState(null);
      // A re-run prefill is one request, for one connection. It is
      // dropped as soon as PlaybooksView has looked at it, and again
      // here whenever the active connection changes — this component
      // stays mounted across a connection switch, so a prefill left in
      // state would otherwise be replayed, against the new connection,
      // the next time the Playbooks view mounted.
      const consumePbRunnerPrefill = useCallback(() => setPbRunnerPrefill(null), []);
      useEffect(() => { setPbRunnerPrefill(null); }, [activeId]);
      const openPalette = useCallback(() => setPaletteOpen(true), []);
      // Stage prefill/selection only after setView confirms the
      // navigation — otherwise a declined "run still streaming" prompt
      // leaves the prefill set to fire on a later unrelated visit.
      const openAdhoc = useCallback((prefill) => {
        if (setView('adhoc')) setAdhocPrefill(prefill || null);
      }, [setView]);
      const runPlaybook = useCallback((id) => {
        if (!setView('playbooks')) return;
        setPlaybookId(id);
        setPbRunnerPrefill(null);
      }, [setView]);
      // openPlaybookRunner navigates to the Playbooks view, selects the
      // matching playbook by path, and asks PlaybooksView to auto-open
      // its Run dialog with the supplied prefill. Used by History's
      // Re-run / Retry failed actions.
      const openPlaybookRunner = useCallback((prefill) => {
        if (!prefill) return;
        if (!setView('playbooks')) return;
        // Exact path only; PlaybooksView applies the same rule and
        // refuses to open the dialog when nothing matches.
        const pbs = (globalThis.AnsibleData || {}).PLAYBOOKS || [];
        const match = pbs.find(p => p.path === prefill.playbookPath);
        if (match) setPlaybookId(match.id);
        setPbRunnerPrefill({ ...prefill, issuedAt: Date.now() });
      }, [setView]);

      const crumb = {
        dashboard: ['Workspace', 'Dashboard'],
        inventory: ['Workspace', 'Inventory'],
        playbooks: ['Workspace', 'Playbooks'],
        adhoc: ['Workspace', 'Ad-hoc'],
        bootstrap: ['Workspace', 'Bootstrap'],
        history: ['Workspace', 'Runs'],
        vault: ['Workspace', 'Secrets']
      }[view];

      const ViewNode = (() => {
        switch (view) {
          case 'dashboard': return <window.DashboardView onNavigate={setView} onOpenAdhoc={openAdhoc}/>;
          case 'inventory': return <window.InventoryView onOpenAdhoc={openAdhoc}/>;
          case 'playbooks': return <window.PlaybooksView initialId={playbookId} runnerPrefill={pbRunnerPrefill} activeServer={{ id: activeId, name: activeName }} onRunnerPrefillConsumed={consumePbRunnerPrefill}/>;
          case 'adhoc': return <window.AdhocView prefill={adhocPrefill}/>;
          case 'bootstrap': return <window.BootstrapView/>;
          case 'history': return <window.HistoryView onOpenPlaybook={runPlaybook} onRunPlaybook={openPlaybookRunner} onOpenAdhoc={openAdhoc} activeServer={{ id: activeId, name: activeName }}/>;
          case 'vault': return <window.VaultView/>;
          default: return null;
        }
      })();

      const layoutClass = `app ${tweaks.navLayout === 'topnav' ? 'topnav-layout' : ''}`;

      return (
        <div className={layoutClass} data-screen-label={`ansbui · ${view}`}>
          {tweaks.navLayout === 'sidebar' && <window.Sidebar view={view} setView={setView}/>}
          <div className="app-main">
            <window.TopNav
              view={view} setView={setView}
              onOpenPalette={openPalette}
              breadcrumb={crumb}
              activeName={activeName}
              onManage={() => setManagerOpen(true)}
              authEnabled={authEnabled}
              onLogout={onLogout}
            />
            {tweaks.navLayout === 'topnav' && <window.TopLayoutNav view={view} setView={setView}/>}
            <div style={{ minHeight: 0, overflow: 'auto' }}>
              {ViewNode}
            </div>
          </div>

          <window.CommandPalette
            open={paletteOpen}
            onClose={() => setPaletteOpen(false)}
            onNavigate={setView}
            onOpenAdhoc={openAdhoc}
            onRunPlaybook={runPlaybook}
          />

          <window.ConnectionManager
            open={managerOpen}
            onClose={() => setManagerOpen(false)}
            onActivated={() => { setManagerOpen(false); onReload({ keepManagerOpen: false }); }}
            initialServers={servers}
            initialActiveId={activeId}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Boot/>);
  </script>
</body>
</html>
